name: ARMhf GNU toolchain probe

on:
  push:
    branches:
      - compat/android-8.1-armv7
    paths:
      - '.github/workflows/armhf-toolchain-probe.yml'
      - 'tools/armhf/**'
  pull_request:
    paths:
      - '.github/workflows/armhf-toolchain-probe.yml'
      - 'tools/armhf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-armhf-cross-toolchain:
    name: Debian ARMv7 hard-float C and Rust ELF probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian ARMhf cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Install Rust ARMhf target
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          rustc --version
          cargo --version
      - name: Compile and inspect ARMhf C and Rust executables
        run: bash tools/armhf/toolchain-probe.sh
