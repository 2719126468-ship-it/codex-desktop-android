name: Publish the verified phone rootfs archive

# One-time, manual: republish the 1.27 GiB first-install archive as its own release
# asset so the small APK can be installed without downloading a 1.4 GiB APK.
# The bytes are fetched once with the GitHub CLI, which is a single stream with
# integrity handling, and the published archive is re-hashed against the signed
# descriptor inside the pinned v80 APK before anything is uploaded.

on:
  # A dispatch-only workflow is indexed from the default branch alone, which makes it
  # undiscoverable on a topic branch. The push trigger only registers the file; the job
  # itself still refuses to run unless a human dispatched it.
  push:
    branches: [main, 'compat/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the archive; blank = rootfs-v80'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: rootfs-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-rootfs:
    name: Verify and publish codex-phone-rootfs.tar.gz
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: d3d0aea653d6748be2c65e88093ce8d88f24a5031e251709d9d01c995bf58ec1
      EXPECTED_BYTES: '1367052023'
      SOURCE_REPO: JinShichang/codex-desktop-android
      SOURCE_TAG: v80
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fetch the published archive with the GitHub CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          gh release download v80 \
            -R JinShichang/codex-desktop-android \
            -p 'codex-phone-rootfs.tar.gz' \
            -D "$RUNNER_TEMP/out" --clobber
          out="$RUNNER_TEMP/out/codex-phone-rootfs.tar.gz"
          test -s "$out"
          echo "downloaded $(stat -c '%s' "$out") bytes"
      - name: Authenticate the archive against the signed descriptor
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out/codex-phone-rootfs.tar.gz"
          actual_bytes=$(stat -c '%s' "$out")
          actual_sha=$(sha256sum "$out" | awk '{print $1}')
          echo "bytes=$actual_bytes sha256=$actual_sha"
          test "$actual_bytes" = "$EXPECTED_BYTES" || { echo '::error::archive size differs from the signed descriptor'; exit 1; }
          test "$actual_sha" = "$EXPECTED_SHA256" || { echo '::error::archive digest differs from the signed descriptor'; exit 1; }
          gzip -t "$out"
          members=$(tar -tzf "$out" | wc -l)
          echo "members=$members"
          test "$members" = '28430' || { echo '::error::member count differs from the signed descriptor'; exit 1; }
      - name: Publish the archive as its own release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out/codex-phone-rootfs.tar.gz"
          tag="${INPUT_TAG:-rootfs-v80}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; releases are never overwritten."
            exit 1
          fi
          sha=$(sha256sum "$out" | awk '{print $1}')
          bytes=$(stat -c '%s' "$out")
          ( cd "$RUNNER_TEMP/out" && sha256sum codex-phone-rootfs.tar.gz > codex-phone-rootfs.tar.gz.sha256 )
          notes="$RUNNER_TEMP/notes.md"
          {
            echo '## Codex Android first-install environment'
            echo
            echo 'Signed-descriptor-verified Debian/desktop environment for the API 27 ARM64 builds.'
            echo
            echo '| item | value |'
            echo '| --- | --- |'
            echo "| bytes | $bytes |"
            echo "| sha256 | \`$sha\` |"
            echo '| members | 28430 |'
            echo "| source | ${SOURCE_REPO} ${SOURCE_TAG}, hashed against the signed phone-runtime descriptor |"
            echo "| build | https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo '### Install'
            echo
            echo '```'
            echo 'adb push codex-phone-rootfs.tar.gz /sdcard/Download/'
            echo '```'
            echo
            echo 'Keep the file name unchanged. The APK verifies it against its embedded descriptor; no extraction by hand.'
          } > "$notes"
          gh release create "$tag" "$out" "$RUNNER_TEMP/out/codex-phone-rootfs.tar.gz.sha256" \
            --target "$TARGET_SHA" \
            --title "Codex Android first-install environment ($tag)" \
            --notes-file "$notes"
          gh release view "$tag" --json tagName,url,assets \
            --jq '.tagName, .url, (.assets[] | .name + " " + (.size | tostring))'
