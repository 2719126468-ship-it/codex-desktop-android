pluginManagement {
    repositories {
        google()
        // Use the Google-hosted Maven Central mirror first to avoid shared-runner
        // rate limits; retain Maven Central as the canonical fallback.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'Codex'
include ':app', ':lorie', ':shell-loader:stub', ':shizukuTransport'
project(':lorie').projectDir = file('../vendor/termux-x11/lorie')
project(':shell-loader:stub').projectDir = file('../vendor/termux-x11/shell-loader/stub')
project(':shizukuTransport').projectDir = file('../tools/executor/shizuku-service/transport')
